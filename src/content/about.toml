[skills]
footer = 'Furthermore, I enjoy competitive programming in the form of \textbf{LeetCode} or \textbf{Advent of Code}. To that end, I have dabbled in several other programming languages, including \textbf{C++}, \textbf{Go} and \textbf{C#}.'

[thesis]
title = 'Improving Prior-Guided Bayesian Optimization through Revisited Decay and Rejection Mechanisms'
place = 'Institute for Artificial Intelligence, 2026'
paragraphs = [
  'Bayesian optimization finds good settings for expensive systems, like the hyperparameters of a neural network, in as few tries as possible. Prior-guided variants let a user say where they think good settings are. If that guess is wrong, it can slow everything down.',
  '''I reworked how quickly the optimizer lets go of the user's guess and when it rejects it outright, so it keeps the speed-up from good guesses and recovers faster from bad ones.''',
]

